    function formatMacInput(input) {
        let val = input.value.replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        if (val.length > 12) val = val.substring(0, 12);

        const parts = [];
        for (let i = 0; i < val.length; i += 2) {
            parts.push(val.substring(i, i + 2));
        }
        input.value = parts.join(":");

        const feedback = document.getElementById("devMacFeedback");
        if (feedback) {
            if (val.length === 12) {
                feedback.textContent = "✓ Valid 12-digit MAC address";
                feedback.className = "text-[10px] text-emerald-400 mt-1 block font-semibold";
            } else {
                feedback.textContent = `${val.length}/12 hexadecimal digits`;
                feedback.className = "text-[10px] text-slate-400 mt-1 block";
            }
        }
    }

    async function checkLiveModelCompatibility(model) {
        const feedback = document.getElementById("devModelFeedback");
        if (!model || !model.trim()) {
            if (feedback) {
                feedback.textContent = "Enter model to check compatibility";
                feedback.className = "text-[10px] text-slate-400 mt-1 block";
            }
            return;
        }

        try {
            const resp = await fetchWithAuth(`/api/v1/telecom/devices/check-compatibility/${encodeURIComponent(model.trim())}`);
            if (!resp.ok) return;
            const data = await resp.json();

            if (feedback) {
                if (data.category === "NATIVE_MPP") {
                    feedback.textContent = `✓ Native MPP / Cloud Supported (${data.model})`;
                    feedback.className = "text-[10px] text-emerald-400 mt-1 block font-semibold";
                    setDeviceMigrationMode("NATIVE_MPP");
                } else if (data.category === "ENTERPRISE_CONVERTIBLE") {
                    feedback.textContent = `⚡ Enterprise-to-MPP Convertible (${data.model})`;
                    feedback.className = "text-[10px] text-amber-400 mt-1 block font-semibold";
                    setDeviceMigrationMode("ENTERPRISE_TO_MPP");
                } else if (data.category === "LEGACY_UNSUPPORTED") {
                    feedback.textContent = `✕ End-of-Life Model: Refresh or ATA Required`;
                    feedback.className = "text-[10px] text-rose-400 mt-1 block font-semibold";
                } else {
                    feedback.textContent = `Generic SIP / Unknown Model`;
                    feedback.className = "text-[10px] text-slate-300 mt-1 block";
                }
            }
        } catch (e) {
            console.warn("Could not check model compatibility:", e);
        }
    }

    async function submitSingleDeviceOnboard(stepUpCredentials = null) {
        if (currentDeviceMigrationMode === "SOFTPHONE_ONLY") {
            return syncUserCallingProfileFromForm(stepUpCredentials);
        }

        const mac = document.getElementById("devInputMac").value.trim();
        const model = document.getElementById("devInputModel").value.trim();
        const owner = document.getElementById("devInputOwner").value.trim();
        const locationId = document.getElementById("devSelectLocation").value || null;
        const phone = document.getElementById("devInputPhone") ? document.getElementById("devInputPhone").value.trim() : "";
        const ext = document.getElementById("devInputExtension") ? document.getElementById("devInputExtension").value.trim() : "";
        const dryRun = document.getElementById("devCheckDryRun").checked;
        const generateCode = document.getElementById("devCheckActivationCode").checked;
        const btn = document.getElementById("btnSubmitDevice");

        if (!mac) {
            alert("Please enter a device MAC address (or switch to Option C: Softphone-Only User if the user has no physical phone).");
            return;
        }
        if (!model) {
            alert("Please enter a phone model.");
            return;
        }
        if (!owner) {
            alert("Please enter an assigned user email or workspace name.");
            return;
        }

        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`WARNING: You are about to LIVE ONBOARD device ${mac} into Webex Calling.\n\nProceed to authenticate with corporate directory credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => submitSingleDeviceOnboard({ username, password }));
            return;
        }

        const deviceItem = {
            mac_address: mac,
            model: model,
            migration_mode: currentDeviceMigrationMode,
            location_id: locationId,
        };
        if (phone) deviceItem.phone_number = phone;
        if (ext) deviceItem.extension = ext;

        if (owner.includes("@")) {
            deviceItem.user_email = owner;
        } else {
            deviceItem.workspace_name = owner;
        }

        const payload = {
            devices: [deviceItem],
            dry_run: dryRun,
            generate_activation_codes: generateCode,
            step_up_user: stepUpCredentials ? stepUpCredentials.username : null,
            step_up_pass: stepUpCredentials ? stepUpCredentials.password : null,
        };

        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin inline-block mr-2">⟳</span> Processing...`;

        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/devices/onboard", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.detail || "Onboarding failed.");
            }

            const item = data.results && data.results.length ? data.results[0] : null;
            if (item) {
                renderOnboardingResults([item]);
                if (item.status === "FAILED") {
                    showOnboardingError(item.details, item.mac_address);
                } else {
                    hideOnboardingError();
                    if (item.technician_instructions) {
                        showTechnicianInstructions(item.technician_instructions, item.mac_address, item.model, item.owner_identity);
                    }
                }
            }
        } catch (err) {
            showOnboardingError(err.message, mac);
            alert("Device onboarding failed: " + err.message);
        } finally {
            btn.disabled = false;
            const label = currentDeviceMigrationMode === "SOFTPHONE_ONLY" ? "Provision Softphone User" : "Execute Onboarding";
            btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> <span id="btnSubmitDeviceLabel">${label}</span>`;
        }
    }

    function parseSoftphoneBatchLines(rawText, defaultLocationId, callingLicenseId) {
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (!lines.length) return [];

        const stripQuotes = (s) => String(s || "").trim().replace(/^["']|["']$/g, "").trim();
        const firstCols = lines[0].split(",").map(c => stripQuotes(c).toLowerCase());
        const hasHeader = firstCols.some(c => c === "email" || c === "e-mail");
        const startIdx = hasHeader ? 1 : 0;

        const emailIdx = hasHeader ? firstCols.findIndex(c => c === "email" || c === "e-mail") : 0;
        const extIdx = hasHeader ? firstCols.findIndex(c => c === "extension" || c === "ext" || c === "dn") : 1;
        const phoneIdx = hasHeader ? firstCols.findIndex(c => c === "phone number" || c === "phonenumber" || c === "did") : 2;

        const users = [];
        for (let i = startIdx; i < lines.length; i++) {
            const cols = lines[i].split(",").map(stripQuotes);
            const email = cols[emailIdx] || "";
            if (!email || !email.includes("@")) continue;
            const ext = extIdx >= 0 ? (cols[extIdx] || null) : null;
            const phone = phoneIdx >= 0 ? (cols[phoneIdx] || null) : null;
            users.push({
                email: email,
                location_id: defaultLocationId,
                extension: ext,
                phone_number: phone,
                calling_license_id: callingLicenseId,
                caller_id_type: phone ? "DIRECT_LINE" : "LOCATION_NUMBER",
                voicemail_enabled: true,
                voicemail_email_notification: true,
                voicemail_attach_audio: true
            });
        }
        return users;
    }

    async function submitSoftphoneBatchProvision(stepUpCredentials = null) {
        const rawText = document.getElementById("softphoneBatchInput")?.value.trim() || "";
        const locationId = document.getElementById("devSelectLocation")?.value || "";
        const locationName = document.getElementById("devSelectLocationName")?.value || "";
        const dryRun = document.getElementById("devCheckDryRun") ? document.getElementById("devCheckDryRun").checked : true;
        const callingLicenseId = document.getElementById("devLicenseSelect")?.value
            || document.getElementById("controlLicenseSelect")?.value
            || document.getElementById("bulkLicenseSelect")?.value
            || document.getElementById("wsLicenseSelect")?.value
            || null;

        if (!locationId) {
            alert("Please select a target Webex Location above before running the softphone batch.");
            return;
        }
        const users = parseSoftphoneBatchLines(rawText, locationId, callingLicenseId);
        if (!users.length) {
            alert("Enter at least one valid user email (one per line, e.g. user@company.com, 4101, +15125554101).");
            return;
        }

        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`WARNING: You are about to LIVE PROVISION ${users.length} softphone-only user(s) into Webex Calling.\n\nTarget Location: ${locationName || locationId}\n\nProceed to authenticate with corporate credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => submitSoftphoneBatchProvision({ username, password }));
            return;
        }

        const btn = document.getElementById("btnSoftphoneBatch");
        if (btn) {
            btn.disabled = true;
            btn.textContent = "Processing Batch...";
        }

        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/users/provision-calling-profile", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    users: users,
                    calling_license_id: callingLicenseId,
                    default_location_id: locationId,
                    sync_redsky: true,
                    dry_run: dryRun,
                    step_up_user: stepUpCredentials ? stepUpCredentials.username : null,
                    step_up_pass: stepUpCredentials ? stepUpCredentials.password : null
                })
            });
            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.detail || "Batch softphone provisioning failed.");
            }

            hideOnboardingError();
            const mapped = (data.results || []).map(it => ({
                mac_address: "SOFTPHONE (NO MAC)",
                model: "Webex App (Softphone)",
                migration_mode: "SOFTPHONE_ONLY",
                owner_identity: it.email,
                status: it.status,
                details: it.details,
                activation_code: null,
                technician_instructions: null
            }));
            renderOnboardingResults(mapped);
            const batchSummary = `Softphone Batch ${dryRun ? "Dry-Run" : "Live"} Complete: ${data.successful_count} succeeded, ${data.failed_count} failed, ${data.skipped_count} skipped.`;
            if (data.failed_count > 0 && data.successful_count === 0) {
                showOnboardingError(batchSummary, "Batch Softphone");
            } else {
                showOnboardingSuccess(
                    dryRun ? "Softphone Batch Dry-Run Complete" : "Softphone Batch Complete",
                    `${data.successful_count} succeeded, ${data.failed_count} failed, ${data.skipped_count} skipped`,
                    batchSummary
                );
            }
            alert(batchSummary);
        } catch (err) {
            showOnboardingError(err.message, "Batch Softphone");
            alert("Batch softphone provisioning failed: " + err.message);
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.textContent = "Provision Softphone Batch";
            }
        }
    }
    window.submitSoftphoneBatchProvision = submitSoftphoneBatchProvision;

    async function loadCucmDialplanOptions(clusterOverride = null) {
        const cluster = clusterOverride || (document.getElementById("cucmDecomCluster") ? document.getElementById("cucmDecomCluster").value : "PRIMARY");
        const ptSelect = document.getElementById("tpSelectPartition");
        const gwSelect = document.getElementById("tpSelectGateway");
        const ptBadge = document.getElementById("cucmPtCountBadge");
        const gwBadge = document.getElementById("cucmGwCountBadge");
        const customContainer = document.getElementById("customGatewayInputContainer");

        if (!ptSelect && !gwSelect) return;

        if (customContainer) customContainer.classList.add("hidden");
        if (ptBadge) ptBadge.textContent = "";
        if (gwBadge) gwBadge.textContent = "";

        if (cucmDialplanOptionsCache[cluster]) {
            populateDialplanDropdowns(cucmDialplanOptionsCache[cluster]);
            return;
        }

        if (ptSelect) {
            ptSelect.innerHTML = `<option value="">Loading partitions for ${cluster}...</option>`;
            ptSelect.disabled = true;
        }
        if (gwSelect) {
            gwSelect.innerHTML = `<option value="">Loading gateways &amp; route lists for ${cluster}...</option>`;
            gwSelect.disabled = true;
        }

        try {
            const resp = await fetchWithAuth(`/api/v1/telecom/cucm/dialplan-options?cluster=${encodeURIComponent(cluster)}`);
            if (!resp.ok) {
                throw new Error(`Server returned status ${resp.status}`);
            }
            const data = await resp.json();
            cucmDialplanOptionsCache[cluster] = data;
            populateDialplanDropdowns(data);
        } catch (err) {
            console.warn("Could not load dialplan options from CallManager:", err);
            if (ptSelect) {
                ptSelect.disabled = false;
                ptSelect.innerHTML = `
                    <option value="Internal_PT" selected>Internal_PT (Default Fallback)</option>
                `;
            }
            if (gwSelect) {
                gwSelect.disabled = false;
                gwSelect.innerHTML = `
                    <option value="" disabled selected>-- Select Gateway / Route List (Fallback) --</option>
                    <option value="To_LGW_RL" data-is-rl="true">To_LGW_RL [Route List]</option>
                    <option value="LGW_CUBE_Trunk" data-is-rl="false">LGW_CUBE_Trunk [Trunk]</option>
                    <option value="__CUSTOM__">✏️ -- Enter Custom Gateway / Route List Name --</option>
                `;
            }
        }
    }

    function populateDialplanDropdowns(data) {
        const ptSelect = document.getElementById("tpSelectPartition");
        const gwSelect = document.getElementById("tpSelectGateway");
        const ptBadge = document.getElementById("cucmPtCountBadge");
        const gwBadge = document.getElementById("cucmGwCountBadge");

        const partitions = data.partitions || [];
        const gwList = data.gateways_and_route_lists || [];

        if (ptBadge) {
            ptBadge.textContent = partitions.length > 0 ? `(${partitions.length} partitions)` : "";
        }
        if (gwBadge) {
            gwBadge.textContent = gwList.length > 0 ? `(${gwList.length} destinations)` : "";
        }

        if (ptSelect) {
            ptSelect.disabled = false;
            ptSelect.innerHTML = "";
            if (partitions.length === 0) {
                const opt = new Option("Internal_PT (Default)", "Internal_PT");
                ptSelect.add(opt);
            } else {
                let internalSelected = false;
                partitions.forEach(p => {
                    const label = p.description ? `${p.name} (${p.description})` : p.name;
                    const opt = new Option(label, p.name);
                    if (!internalSelected && p.name.toLowerCase().includes("internal")) {
                        opt.selected = true;
                        internalSelected = true;
                    }
                    ptSelect.add(opt);
                });
            }
        }

        if (gwSelect) {
            gwSelect.disabled = false;
            gwSelect.innerHTML = "";
            if (gwList.length === 0) {
                const opt = new Option("No Gateways or Route Lists found in CallManager", "");
                opt.disabled = true;
                opt.selected = true;
                gwSelect.add(opt);
            } else {
                const defaultOpt = new Option(`-- Select Gateway or Route List (${gwList.length} available) --`, "");
                defaultOpt.disabled = true;
                defaultOpt.selected = true;
                gwSelect.add(defaultOpt);

                gwList.forEach(g => {
                    const badge = g.class_name ? ` [${g.class_name}]` : "";
                    const desc = g.description ? ` (${g.description})` : "";
                    const label = `${g.name}${badge}${desc}`;
                    const opt = new Option(label, g.name);
                    opt.setAttribute("data-is-rl", g.is_route_list ? "true" : "false");
                    gwSelect.add(opt);
                });
            }

            // Always add the custom destination option
            const customOpt = new Option("✏️ -- Enter Custom Gateway / Route List Name --", "__CUSTOM__");
            gwSelect.add(customOpt);
        }
    }

    async function submitTranslationPattern(stepUpCredentials = null) {
        const ext = document.getElementById("tpInputExt").value.trim();
        const pt = document.getElementById("tpSelectPartition") ? document.getElementById("tpSelectPartition").value : (document.getElementById("tpInputPartition") ? document.getElementById("tpInputPartition").value : "Internal_PT");
        const gwSelect = document.getElementById("tpSelectGateway");
        const cluster = document.getElementById("cucmDecomCluster").value;
        const dryRun = document.getElementById("tpCheckDryRun").checked;
        const btn = document.getElementById("btnSubmitTp");

        let gw = gwSelect ? gwSelect.value : "";
        let isRl = undefined;

        if (gw === "__CUSTOM__") {
            const customInput = document.getElementById("tpInputCustomGateway");
            gw = customInput ? customInput.value.trim() : "";
            if (!gw) {
                alert("Please enter the custom Gateway or Route List destination name.");
                if (customInput) customInput.focus();
                return;
            }
            const customTypeRadios = document.getElementsByName("customGwType");
            let selectedType = "route_list";
            for (const r of customTypeRadios) {
                if (r.checked) selectedType = r.value;
            }
            isRl = (selectedType === "route_list");
        } else {
            if (!gw) {
                alert("Please select a Gateway or Route List.");
                return;
            }
            isRl = gwSelect && gwSelect.selectedOptions[0] ? (gwSelect.selectedOptions[0].getAttribute("data-is-rl") === "true") : undefined;
        }

        if (!ext) {
            alert("Please enter an extension or directory number.");
            return;
        }
        if (!pt) {
            alert("Please select a Route Partition.");
            return;
        }

        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`WARNING: You are about to inject a LIVE Route Pattern for extension ${ext} in CUCM cluster ${cluster}.\n\nCalls will immediately route to ${gw}. Proceed to authenticate with corporate directory credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => submitTranslationPattern({ username, password }));
            return;
        }

        const payload = {
            extension: ext,
            partition: pt,
            gateway_route_list: gw,
            is_route_list: isRl,
            cluster: cluster,
            dry_run: dryRun,
            step_up_user: stepUpCredentials ? stepUpCredentials.username : null,
            step_up_pass: stepUpCredentials ? stepUpCredentials.password : null,
        };

        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin inline-block mr-1">⟳</span> Injecting...`;

        try {
            const resp = await fetchWithAuth("/api/v1/telecom/cucm/route-pattern", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || "Route pattern injection failed.");

            appendDecommissionLog({
                device_name: "N/A (Dial-Plan Only)",
                model: "Route Pattern",
                extension: data.pattern,
                translation_pattern_status: data.status,
                route_pattern_status: data.status,
                device_deletion_status: "SKIPPED",
                license_reclaimed: "None",
                status: data.status,
                details: data.details,
            });

            alert(`Route Pattern for ${ext}: ${data.status}\n${data.details}`);
        } catch (err) {
            alert("Failed to inject route pattern: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = "Inject Route Pattern";
        }
    }

    function normalizeCucmDeviceToken(token) {
        const rawOrig = (token || "").trim();
        if (!rawOrig) return "";
        const upper = rawOrig.toUpperCase();
        if (/^(CSF|TCT|BOT|TAB)[A-Z0-9._-]+$/.test(upper)) {
            return upper;
        }
        let hexCandidate = upper;
        if (hexCandidate.startsWith("SEP")) {
            hexCandidate = hexCandidate.substring(3);
        }
        const cleanHex = hexCandidate.replace(/[^0-9A-F]/g, "");
        if (cleanHex.length === 12 && /^[0-9A-F]{12}$/.test(cleanHex) && !/^[A-Za-z]/.test(rawOrig.replace(/^SEP/i, ""))) {
            return `SEP${cleanHex}`;
        }
        if (cleanHex.length >= 12 && upper.startsWith("SEP")) {
            return `SEP${cleanHex.substring(0, 12)}`;
        }
        if (/^[0-9A-F:\-.]{12,17}$/.test(upper) && cleanHex.length === 12) {
            return `SEP${cleanHex}`;
        }
        if (/^[A-Za-z][A-Za-z0-9._-]{1,63}$/.test(rawOrig) && !upper.startsWith("SEP")) {
            return rawOrig;
        }
        return rawOrig;
    }

    async function findCucmDevicesByExtension() {
        const extInput = document.getElementById("decomInputExt");
        const tpExtInput = document.getElementById("tpInputExt");
        const macInput = document.getElementById("decomInputMac");
        const feedback = document.getElementById("decomDeviceFeedback");
        const cluster = document.getElementById("cucmDecomCluster")?.value || "PRIMARY";
        const pt = document.getElementById("tpSelectPartition")?.value || "";
        const btn = document.getElementById("btnFindDevicesByExt");

        const ext = (extInput?.value || tpExtInput?.value || "").trim();
        if (!ext) {
            alert("Enter an Extension first (e.g. 801682) to look up its CUCM devices.");
            if (extInput) extInput.focus();
            return;
        }
        if (extInput && !extInput.value) extInput.value = ext;

        if (btn) btn.disabled = true;
        if (feedback) {
            feedback.textContent = `Searching CUCM (${cluster}) for devices holding DN ${ext}...`;
            feedback.className = "text-[10px] text-cyan-400 mt-1 block animate-pulse";
        }

        try {
            const ptQuery = pt ? `&partition=${encodeURIComponent(pt)}` : "";
            const resp = await fetchWithAuth(`/api/v1/telecom/cucm/devices-by-extension/${encodeURIComponent(ext)}?cluster=${encodeURIComponent(cluster)}${ptQuery}`);
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || `Server returned ${resp.status}`);

            const devs = data.devices || [];
            if (!devs.length) {
                if (feedback) {
                    feedback.textContent = `No CUCM devices currently hold DN ${ext}${pt ? ` in ${pt}` : ""}.`;
                    feedback.className = "text-[10px] text-amber-400 mt-1 block font-semibold";
                }
                return;
            }

            const names = devs.map(d => d.device_name).filter(Boolean);
            if (macInput) macInput.value = names.join(", ");
            if (feedback) {
                const summary = devs.map(d => `${d.device_name} (${d.model || "Device"})`).join(" + ");
                feedback.textContent = `✓ Found ${devs.length} device(s) on DN ${ext}: ${summary}`;
                feedback.className = "text-[10px] text-emerald-400 mt-1 block font-semibold";
            }
        } catch (err) {
            if (feedback) {
                feedback.textContent = `Lookup failed: ${err.message}`;
                feedback.className = "text-[10px] text-rose-400 mt-1 block";
            }
        } finally {
            if (btn) btn.disabled = false;
        }
    }
    window.findCucmDevicesByExtension = findCucmDevicesByExtension;

    function inspectCucmDeviceDebounced(val) {
        clearTimeout(cucmInspectTimer);
        const feedback = document.getElementById("decomDeviceFeedback");
        if (!val || !val.trim()) {
            if (feedback) {
                feedback.textContent = "Enter one or comma-separated MAC/device names, or click Find by Ext";
                feedback.className = "text-[10px] text-slate-400 mt-1 block";
            }
            return;
        }

        const tokens = val.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean);
        if (tokens.length > 1) {
            const parsed = tokens.map(normalizeCucmDeviceToken);
            if (feedback) {
                feedback.textContent = `✓ ${parsed.length} CUCM devices queued for batch cleanup: ${parsed.join(", ")}`;
                feedback.className = "text-[10px] text-cyan-300 mt-1 block font-semibold";
            }
            return;
        }

        const rawOrig = tokens[0];
        const upper = rawOrig.toUpperCase();
        const isNamed = /^(CSF|TCT|BOT|TAB)[A-Z0-9._-]+$/.test(upper) || (/^[A-Za-z][A-Za-z0-9._-]{1,63}$/.test(rawOrig) && !upper.startsWith("SEP") && !/^[0-9A-F]{12}$/.test(upper));
        let deviceName = "";
        if (isNamed) {
            deviceName = normalizeCucmDeviceToken(rawOrig);
        } else {
            let rawHex = upper.startsWith("SEP") ? upper.substring(3) : upper;
            const cleanMac = rawHex.replace(/[^0-9A-F]/g, "");
            if (cleanMac.length < 12) {
                if (feedback) {
                    feedback.textContent = `Enter 12-digit MAC or CUCM device name (CSF/TCT/BOT/TAB or Jabber name) (${cleanMac.length}/12 hex characters)`;
                    feedback.className = "text-[10px] text-slate-400 mt-1 block";
                }
                return;
            }
            deviceName = `SEP${cleanMac.substring(0, 12)}`;
        }

        if (feedback) {
            feedback.textContent = `Querying CUCM cluster for ${deviceName}...`;
            feedback.className = "text-[10px] text-cyan-400 mt-1 block animate-pulse";
        }

        cucmInspectTimer = setTimeout(async () => {
            const cluster = document.getElementById("cucmDecomCluster").value;
            try {
                const resp = await fetchWithAuth(`/api/v1/telecom/cucm/device/${encodeURIComponent(deviceName)}?cluster=${encodeURIComponent(cluster)}`);
                if (!resp.ok) {
                    if (resp.status === 404) {
                        if (feedback) {
                            feedback.textContent = `Device '${deviceName}' not found in CUCM (already decommissioned)`;
                            feedback.className = "text-[10px] text-amber-400 mt-1 block font-semibold";
                        }
                        return;
                    }
                    const errData = await resp.json().catch(() => ({}));
                    const detail = errData.detail || `Server returned ${resp.status}`;
                    throw new Error(detail);
                }
                const data = await resp.json();
                const dev = data.device;
                if (feedback) {
                    const lineStr = (dev.lines && dev.lines.length > 0) ? ` | Line: ${dev.lines[0].line_dn}` : "";
                    feedback.textContent = `✓ ${dev.model || "Cisco Phone"} (${dev.device_name})${lineStr} | License: ${dev.license_reclaim_tier}`;
                    feedback.className = "text-[10px] text-emerald-400 mt-1 block font-semibold";
                }

                // If lines are assigned, auto-fill primary extension
                const extInput = document.getElementById("decomInputExt");
                if (extInput && dev.lines && dev.lines.length && !extInput.value) {
                    extInput.value = dev.lines[0].line_dn;
                }
            } catch (err) {
                if (feedback) {
                    feedback.textContent = `Could not verify device with CUCM: ${err.message}`;
                    feedback.className = "text-[10px] text-rose-400 mt-1 block";
                }
            }
        }, 500);
    }

    async function submitCucmDecommission(stepUpCredentials = null) {
        const mac = document.getElementById("decomInputMac").value.trim();
        const ext = document.getElementById("decomInputExt").value.trim() || null;
        const createTp = document.getElementById("decomCheckCreateTp").checked;
        const deleteDn = document.getElementById("decomCheckDeleteDn").checked;
        const cluster = document.getElementById("cucmDecomCluster").value;
        const dryRun = document.getElementById("decomCheckDryRun").checked;
        const btn = document.getElementById("btnSubmitDecom");

        if (!mac) {
            alert("Please enter one or more device MAC addresses or CUCM device names (e.g. BOTSTTM, ThomasJabber), or click 'Find Devices by Ext'.");
            return;
        }

        const targetDevices = mac
            .split(/[\n,;]+/)
            .map(s => normalizeCucmDeviceToken(s))
            .filter(Boolean);

        if (!targetDevices.length) {
            alert("Please enter a valid device MAC or CUCM device name.");
            return;
        }

        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`WARNING: You are about to LIVE DECOMMISSION ${targetDevices.join(", ")} from CUCM cluster ${cluster}.\n\nThis will permanently delete the device registration(s) to release Cisco Smart Licenses${deleteDn ? " and remove the unassigned DN" : ""}.\n\nProceed to authenticate with corporate directory credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => submitCucmDecommission({ username, password }));
            return;
        }

        const pt = document.getElementById("tpSelectPartition") ? document.getElementById("tpSelectPartition").value : "Internal_PT";
        let gw = document.getElementById("tpSelectGateway") ? document.getElementById("tpSelectGateway").value : null;
        if (gw === "__CUSTOM__") {
            const customInput = document.getElementById("tpInputCustomGateway");
            gw = customInput ? customInput.value.trim() : null;
        }

        const payload = {
            items: targetDevices.map(targetDevice => ({
                mac_address: targetDevice,
                extension: ext,
                partition: pt,
                gateway_route_list: gw,
                create_route_pattern: createTp,
                create_translation_pattern: createTp,
                delete_unassigned_dn: deleteDn,
            })),
            default_partition: pt,
            default_gateway_route_list: gw,
            cluster: cluster,
            dry_run: dryRun,
            step_up_user: stepUpCredentials ? stepUpCredentials.username : null,
            step_up_pass: stepUpCredentials ? stepUpCredentials.password : null,
        };

        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin inline-block mr-1">⟳</span> Decommissioning...`;

        try {
            const resp = await fetchWithAuth("/api/v1/telecom/cucm/decommission", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || "Decommissioning failed.");

            const rows = data.results || [];
            rows.forEach(appendDecommissionLog);

            const summaryLines = rows.map(r => `${r.device_name} [${r.status}]: ${r.details}`).join("\n");
            alert(`CUCM Decommission Result (${dryRun ? 'DRY RUN' : 'LIVE'} — ${data.successful_count} ok, ${data.failed_count} failed):\n\n${summaryLines}`);
        } catch (err) {
            alert("Decommissioning failed: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = "Decommission Device(s)";
        }
    }

    function appendDecommissionLog(item) {
        const tbody = document.getElementById("decomResultsBody");
        const countSpan = document.getElementById("decomTableCount");
        if (!tbody) return;

        // Clear placeholder if present
        if (tbody.children.length === 1 && tbody.children[0].innerText.includes("No decommission actions")) {
            tbody.innerHTML = "";
        }

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-800/60 transition";

        let statusBadge = "";
        if (item.status === "SUCCESS") {
            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">SUCCESS</span>`;
        } else if (item.status === "DRY_RUN") {
            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">DRY RUN</span>`;
        } else if (item.status === "SKIPPED") {
            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">SKIPPED</span>`;
        } else {
            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">FAILED</span>`;
        }

        tr.innerHTML = `
            <td class="px-4 py-2.5 font-mono font-bold text-white">${item.device_name}</td>
            <td class="px-4 py-2.5">${item.model || 'Unknown'}</td>
            <td class="px-4 py-2.5 font-mono">${item.extension || '-'}</td>
            <td class="px-4 py-2.5 font-semibold text-xs">${item.translation_pattern_status || '-'}</td>
            <td class="px-4 py-2.5 font-semibold text-xs">${item.device_deletion_status || '-'}</td>
            <td class="px-4 py-2.5 text-purple-300 font-semibold">${item.license_reclaimed || '-'}</td>
            <td class="px-4 py-2.5">${statusBadge}</td>
        `;
        tbody.prepend(tr);

        if (countSpan) {
            countSpan.textContent = `${tbody.children.length} operations`;
        }
    }

    // -------------------------------------------------------------------------
    // Phase 5: Post-Cutover Verification & License Reconciliation
    // -------------------------------------------------------------------------
    async function runPostCutoverValidation() {
        const userEmail = document.getElementById("verifyUserEmail")?.value.trim() || null;
        const macAddress = document.getElementById("verifyMacAddress")?.value.trim() || null;
        const extension = document.getElementById("verifyExtension")?.value.trim() || null;
        const cluster = document.getElementById("verificationCluster")?.value || "PRIMARY";
        const btn = document.getElementById("btnRunVerification");

        if (!userEmail && !macAddress && !extension) {
            alert("Please provide at least a User Email, Handset MAC Address, or Extension to verify.");
            return;
        }

        const payload = {
            user_email: userEmail,
            mac_address: macAddress,
            extension: extension,
            cluster: cluster
        };

        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin inline-block mr-1">⟳</span> Verifying...`;

        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/verification/post-cutover", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.detail || "Verification failed.");
            }

            renderVerificationScorecard(data);
        } catch (err) {
            alert("Post-cutover verification failed: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Run 8-Point Verification
            `;
        }
    }

    function renderVerificationScorecard(data) {
        const scorecard = document.getElementById("verificationScorecard");
        const banner = document.getElementById("readinessBanner");
        const badge = document.getElementById("readinessBadge");
        const title = document.getElementById("readinessTitle");
        const subtitle = document.getElementById("readinessSubtitle");
        const countPassed = document.getElementById("countPassed");
        const countWarnings = document.getElementById("countWarnings");
        const countFailed = document.getElementById("countFailed");
        const tbody = document.getElementById("verificationChecklistBody");

        if (!scorecard || !tbody) return;
        scorecard.classList.remove("hidden");

        countPassed.textContent = data.checks_passed || 0;
        countWarnings.textContent = data.checks_warning || 0;
        countFailed.textContent = data.checks_failed || 0;

        if (data.readiness_status === "CUTOVER_VERIFIED") {
            badge.className = "text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
            badge.textContent = "CUTOVER VERIFIED";
            banner.className = "p-4 rounded-xl border flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-emerald-950/20 border-emerald-800/60";
            title.textContent = "Production Readiness Confirmed";
            subtitle.textContent = "All primary cutover verification checkpoints passed successfully.";
        } else if (data.readiness_status === "ACTION_REQUIRED") {
            badge.className = "text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/40";
            badge.textContent = "ACTION REQUIRED";
            banner.className = "p-4 rounded-xl border flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-amber-950/20 border-amber-800/60";
            title.textContent = "Remediation Recommended";
            subtitle.textContent = "One or more checkpoints returned warnings or failures requiring admin review.";
        } else {
            badge.className = "text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider bg-slate-700 text-slate-300 border border-slate-600";
            badge.textContent = data.readiness_status || "INCOMPLETE";
            banner.className = "p-4 rounded-xl border flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-slate-800/80 border-slate-700";
            title.textContent = "Cutover Assessment";
            subtitle.textContent = "Checklist evaluated with partial or incomplete criteria.";
        }

        tbody.innerHTML = "";
        (data.checks || []).forEach(check => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-slate-800/60 transition";

            let statusBadge = "";
            if (check.status === "PASS") {
                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">PASS</span>`;
            } else if (check.status === "WARNING") {
                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">WARNING</span>`;
            } else if (check.status === "FAIL") {
                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">FAIL</span>`;
            } else {
                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">${check.status}</span>`;
            }

            const recAction = check.recommended_action
                ? `<span class="text-amber-300 font-medium">${check.recommended_action}</span>`
                : `<span class="text-slate-500">-</span>`;

            tr.innerHTML = `
                <td class="px-3 py-2.5 font-mono text-[11px] font-bold text-slate-300">${check.check_id}</td>
                <td class="px-4 py-2.5 font-medium text-white">${check.name}</td>
                <td class="px-3 py-2.5">${statusBadge}</td>
                <td class="px-4 py-2.5 text-slate-300">${check.details}</td>
                <td class="px-4 py-2.5 text-xs">${recAction}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function loadLicenseReconciliation() {
        const cluster = document.getElementById("verificationCluster")?.value || "PRIMARY";
        const btn = document.getElementById("btnRunLicenseAudit");
        const tbody = document.getElementById("licenseReconciliationBody");
        const note = document.getElementById("licenseSummaryNote");

        if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin inline-block mr-1">⟳</span> Auditing...`;
        }

        try {
            const resp = await fetchWithWebexAuth(`/api/v1/telecom/verification/license-reconciliation?cluster=${encodeURIComponent(cluster)}`);
            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.detail || "License reconciliation audit failed.");
            }

            // KPIs
            const kpiCucm = document.getElementById("kpiCucmReclaimed");
            const kpiWebex = document.getElementById("kpiWebexActive");
            const kpiBalance = document.getElementById("kpiAuditBalance");
            const kpiDesc = document.getElementById("kpiAuditDesc");

            if (kpiCucm) kpiCucm.textContent = data.total_reclaimed_cucm_licenses;
            if (kpiWebex) kpiWebex.textContent = data.total_active_webex_licenses;
            if (kpiBalance) {
                if (data.total_reclaimed_cucm_licenses === data.total_active_webex_licenses) {
                    kpiBalance.textContent = "BALANCED";
                    kpiBalance.className = "text-xl font-bold text-emerald-400 mt-1";
                } else if (data.total_reclaimed_cucm_licenses > data.total_active_webex_licenses) {
                    kpiBalance.textContent = `+${data.total_reclaimed_cucm_licenses - data.total_active_webex_licenses} SURPLUS`;
                    kpiBalance.className = "text-xl font-bold text-cyan-400 mt-1";
                } else {
                    kpiBalance.textContent = `-${data.total_active_webex_licenses - data.total_reclaimed_cucm_licenses} DEFICIT`;
                    kpiBalance.className = "text-xl font-bold text-amber-400 mt-1";
                }
            }
            if (kpiDesc) kpiDesc.textContent = `${data.cluster} Cluster Reconciliation`;

            // Breakdown table
            if (tbody) {
                tbody.innerHTML = "";
                (data.items || []).forEach(item => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-800/60 transition";

                    let statusBadge = "";
                    if (item.status === "BALANCED") {
                        statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">BALANCED</span>`;
                    } else if (item.status === "CLEARED") {
                        statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">CLEARED</span>`;
                    } else {
                        statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">${item.status}</span>`;
                    }

                    tr.innerHTML = `
                        <td class="px-4 py-2.5 font-medium text-white">${item.category}</td>
                        <td class="px-4 py-2.5 text-purple-300 font-mono text-[11px]">${item.cucm_smart_license}</td>
                        <td class="px-3 py-2.5 text-center font-bold font-mono text-purple-400">${item.reclaimed_count}</td>
                        <td class="px-4 py-2.5 text-cyan-300 font-mono text-[11px]">${item.webex_equivalent_license}</td>
                        <td class="px-3 py-2.5 text-center font-bold font-mono text-cyan-400">${item.webex_consumed_count}</td>
                        <td class="px-3 py-2.5 text-center">${statusBadge}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            if (note && data.summary) {
                note.textContent = data.summary;
                note.classList.remove("hidden");
            }
        } catch (err) {
            alert("License reconciliation failed: " + err.message);
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reconcile Licenses
                `;
            }
        }
    }
</script>
