<!-- templates/telecom_scripts.html -->
<script>
    function getWebexAccessToken() {
        if (typeof getStoredWebexToken === 'function') {
            const stored = getStoredWebexToken();
            if (stored) return stored;
        }
        return sessionStorage.getItem("webex_token") 
            || localStorage.getItem("webex_token") 
            || document.getElementById("webexAccessToken")?.value.trim() 
            || "";
    }

    let pendingTelecomStepUpAction = null;

    function requestTelecomStepUp(action) {
        pendingTelecomStepUpAction = action;
        openStepUpModal("telecom");
    }

    function clearPendingTelecomStepUpAction() {
        pendingTelecomStepUpAction = null;
    }

    function takePendingTelecomStepUpAction() {
        const action = pendingTelecomStepUpAction;
        pendingTelecomStepUpAction = null;
        return action;
    }

    function syncLicenseSelects(val) {
        if (!val) return;
        ["controlLicenseSelect", "bulkLicenseSelect", "wsLicenseSelect", "devLicenseSelect"].forEach(id => {
            const el = document.getElementById(id);
            if (el && el.value !== val) {
                el.value = val;
            }
        });
    }

    function handleWebexTokenInput() {
        availableLocations = [];
        availableWsLicenses = [];
        availableWebexLicenses = [];
        populateLocationDropdowns();

        ["wsLicenseSelect", "controlLicenseSelect", "bulkLicenseSelect", "devLicenseSelect"].forEach(id => {
            const licenseSelect = document.getElementById(id);
            if (licenseSelect) licenseSelect.innerHTML = "<option value=''>Refresh Webex tenant data</option>";
        });

        stagedEndpoints.forEach(item => {
            item.target_location_id = "";
            item.target_location_name = item.device_pool || "Select Webex location";
        });
        if (lastAuditData) renderTableRows();

        const status = document.getElementById("webexConnectionStatus");
        if (status) {
            status.textContent = "Token changed. Refresh tenant data to validate it and reload locations and licenses.";
            status.className = "text-[11px] text-slate-500";
        }
        resetLocationCorrectionPreview();
    }

    function withWebexAccessToken(url, options = {}) {
        const webexPaths = [
            "/api/v1/telecom/webex-locations",
            "/api/v1/telecom/webex-provision",
            "/api/v1/telecom/execute-staged-provisioning",
            "/api/v1/telecom/migration/provision",
            "/api/v1/telecom/migration/provision-webex",
            "/api/v1/telecom/webex/licenses",
            "/api/v1/telecom/workspaces/validate-csv",
            "/api/v1/telecom/workspaces/import",
            "/api/v1/telecom/workspaces/correct-locations",
            "/api/v1/telecom/locations",
            "/api/v1/telecom/users",
            "/api/v1/telecom/devices",
            "/api/v1/telecom/verification"
        ];
        if (!webexPaths.some(path => url.includes(path))) return options;

        const token = getWebexAccessToken();
        if (!token) return options;
        options.headers = options.headers || {};
        options.headers["X-Webex-Access-Token"] = token;
        return options;
    }

    // Safe Auth Fetch Wrapper (Ensures Bearer tokens are attached across all requests)
    async function fetchWithWebexAuth(url, options = {}) {
        let webexToken = getWebexAccessToken();
        const webexPaths = [
            "/api/v1/telecom/locations",
            "/api/v1/telecom/users",
            "/api/v1/telecom/devices",
            "/api/v1/telecom/verification",
            "/api/v1/telecom/webex",
            "/api/v1/telecom/migration/provision",
            "/api/v1/telecom/execute-staged-provisioning"
        ];
        if (!webexToken && !url.includes("meraki-preview") && webexPaths.some(p => url.includes(p)) && typeof promptWebexToken === 'function') {
            webexToken = promptWebexToken();
        }
        const token = localStorage.getItem("jwt_token") || sessionStorage.getItem("access_token") || localStorage.getItem("access_token");
        options.headers = options.headers || {};
        if (token) {
            if (!options.headers["X-API-Authorization"]) {
                options.headers["X-API-Authorization"] = `Bearer ${token}`;
            }
            if (!options.headers["Authorization"]) {
                options.headers["Authorization"] = `Bearer ${token}`;
            }
        }
        if (webexToken) {
            options.headers["X-Webex-Access-Token"] = webexToken;
        }
        const response = await fetch(url, withWebexAccessToken(url, options));
        return response;
    }

    async function downloadMigrationTemplate(templateType) {
        const filenames = {
            workspaces: "sample_webex_workspaces_template.csv",
            users: "sample_webex_calling_users_template.csv",
            locations: "sample_webex_locations_template.csv",
        };
        const filename = filenames[templateType];
        if (!filename) {
            alert("Unknown CSV template.");
            return;
        }

        try {
            const response = await fetchWithAuth(`/api/v1/telecom/migration/templates/${encodeURIComponent(templateType)}`);
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || "Could not download CSV template.");
            }

            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = downloadUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        } catch (error) {
            alert(`Error downloading CSV template: ${error.message}`);
        }
    }

    // --- State Store: CUCM Staging ---
    let lastAuditData = null;
    let stagedEndpoints = [];
    let availableLocations = [];
    let currentPage = 1;
    const pageSize = 100;

    // --- State Store: UCCX Flow Studio ---
    let currentUccxApps = [];
    let currentUccxCsqs = [];
    let generatedFlowPayload = null;

    document.addEventListener("DOMContentLoaded", async () => {
        populateLocationDropdowns();
        if (typeof initTelecomLocationCombobox === "function") {
            initTelecomLocationCombobox();
        }
        if (typeof getWebexAccessToken === "function" && getWebexAccessToken()) {
            loadWebexLocations().catch(e => console.warn("Initial Webex location load skipped:", e));
            loadWebexLicenses().catch(e => console.warn("Initial Webex license load skipped:", e));
        }
    });
    document.addEventListener("netdashboard:authenticated", () => {
        loadUccxClusterAssets();
        if (typeof getWebexAccessToken === "function" && getWebexAccessToken()) {
            loadWebexLocations().catch(e => console.warn("Webex location load after login skipped:", e));
            loadWebexLicenses().catch(e => console.warn("Webex license load after login skipped:", e));
        }
    });
    document.addEventListener("netdashboard:webex-token-set", () => {
        if (typeof forceRefreshWebexLocations === "function") {
            forceRefreshWebexLocations().catch(e => console.warn("Webex location load after token set skipped:", e));
        } else {
            loadWebexLocations().catch(e => console.warn("Webex location load after token set skipped:", e));
        }
        loadWebexLicenses().catch(e => console.warn("Webex license load after token set skipped:", e));
    });

    // -------------------------------------------------------------------------
    // CUCM Endpoint Audit & Staging Functions
    // -------------------------------------------------------------------------

    function populateLocationDropdowns() {
        const bulkSelect = document.getElementById('bulkLocationSelect');
        if (bulkSelect) {
            if (availableLocations.length === 0) {
                bulkSelect.innerHTML = '<option value="">Paste Webex token and refresh locations</option>';
            } else {
                bulkSelect.innerHTML = availableLocations.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            }
        }
        if (typeof updateCombinedLocations === 'function') {
            updateCombinedLocations();
        }

        const didLocSelect = document.getElementById("didTargetLocation");
        if (didLocSelect && availableLocations.length > 0) {
            const currentVal = didLocSelect.value;
            didLocSelect.innerHTML = "<option value=''>Select Webex location...</option>";
            availableLocations.forEach(l => {
                const opt = document.createElement("option");
                opt.value = l.id;
                const locLabel = [l.city, l.state].filter(Boolean).join(", ");
                opt.textContent = `${l.name} (${locLabel || l.timeZone || ''})`;
                didLocSelect.appendChild(opt);
            });
            if (currentVal) didLocSelect.value = currentVal;
        }
    }

    async function refreshWebexTenantData() {
        const token = getWebexAccessToken();
        const status = document.getElementById("webexConnectionStatus");
        if (!token) {
            if (status) {
                status.textContent = "Paste your Webex bearer token before refreshing.";
                status.className = "text-[11px] text-amber-400";
            }
            if (typeof promptWebexToken === 'function') {
                promptWebexToken();
            }
            return;
        }

        if (status) {
            status.textContent = "Connecting to Webex...";
            status.className = "text-[11px] text-cyan-400";
        }
        const results = await Promise.allSettled([
            loadWebexLocations(),
            loadWebexLicenses()
        ]);
        const failures = results.filter(result => result.status === "rejected");
        if (failures.length) {
            if (status) {
                status.textContent = failures.map(result => result.reason.message).join(" ");
                status.className = "text-[11px] text-rose-400";
            }
        } else {
            const licCount = (availableWebexLicenses && availableWebexLicenses.length) || availableWsLicenses.length;
            if (status) {
                status.textContent = `Connected. Loaded ${availableLocations.length} locations and ${licCount} licenses.`;
                status.className = "text-[11px] text-emerald-400";
            }
        }
    }

    async function loadWebexLocations() {
        const response = await fetchWithWebexAuth("/api/v1/telecom/webex-locations");
        let data = null;
        try {
            data = await response.json();
        } catch (_) {
            data = null;
        }
        if (!response.ok) {
            const detailMsg = (data && data.detail) || `Could not load Webex locations (HTTP ${response.status}).`;
            throw new Error(detailMsg);
        }
        availableLocations = Array.isArray(data) ? data : [];
        populateLocationDropdowns();
        const wsLocCountBadge = document.getElementById("wsDiscoveredLocCount");
        if (wsLocCountBadge) {
            wsLocCountBadge.textContent = `${availableLocations.length} Locations Discovered`;
            wsLocCountBadge.className = availableLocations.length > 0 ? "text-xs font-semibold text-emerald-400" : "text-xs font-semibold text-amber-400";
        }
        if (typeof updateCombinedLocations === 'function') {
            updateCombinedLocations();
        }
        if (typeof fetchMerakiLocationsSilently === 'function') {
            fetchMerakiLocationsSilently();
        }

        if (lastAuditData) {
            stagedEndpoints.forEach(item => {
                if (!item.target_location_id) {
                    const matched = availableLocations.find(
                        location => location.name.toLowerCase() === item.device_pool.toLowerCase()
                    ) || availableLocations[0];
                    if (matched) {
                        item.target_location_id = matched.id;
                        item.target_location_name = matched.name;
                    }
                }
            });
            renderTableRows();
        }
    }

    async function triggerCucmAudit(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        const clusterElem = document.getElementById('cucmClusterSelect');
        const cluster = clusterElem ? clusterElem.value : 'PRIMARY';
        const scope = document.getElementById('deviceScope')?.value || 'PHYSICAL_ONLY';
        const pool = document.getElementById('devicePoolFilter')?.value.trim() || '';
        const countryCode = document.getElementById('countryCode')?.value.trim() || '+1';
        const btn = document.getElementById('btnRunAudit');

        if (btn) btn.disabled = true;
        showStatusBanner(`Connecting to ${cluster} CUCM Publisher (Scope: ${scope})...`, 10);

        try {
            const res = await fetchWithAuth('/api/v1/telecom/cucm-audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cluster: cluster,
                    default_country_code: countryCode,
                    device_scope: scope,
                    device_pool_filter: pool || null
                })
            });
            const data = await res.json();

            if (res.ok && data.task_id) {
                pollAuditTask(data.task_id);
            } else {
                showStatusBanner("Audit trigger failed: " + (data.detail || "Unknown error"), 100);
                if (btn) btn.disabled = false;
            }
        } catch (err) {
            showStatusBanner("Network error starting audit: " + err.message, 100);
            if (btn) btn.disabled = false;
        }
    }

    function pollAuditTask(taskId) {
        const interval = setInterval(async () => {
            try {
                const res = await fetchWithAuth(`/api/v1/telecom/tasks/${taskId}`);
                const data = await res.json();

                if (data.status === 'PENDING') {
                    showStatusBanner(data.message || "Task queued in Celery worker pool...", data.progress || 10);
                } else if (data.status === 'RUNNING' || data.status === 'PROGRESS') {
                    showStatusBanner(data.message || "Auditing CUCM database...", data.progress || 50);
                } else if (data.status === 'COMPLETED') {
                    clearInterval(interval);
                    showStatusBanner("CUCM Audit Complete! Staged for review.", 100);
                    document.getElementById('btnRunAudit').disabled = false;

                    const auditPayload = data.data || data.details || data;
                    if (auditPayload && auditPayload.total_devices !== undefined) {
                        lastAuditData = auditPayload;
                        renderAuditData(auditPayload);
                    }
                } else if (data.status === 'FAILED') {
                    clearInterval(interval);
                    showStatusBanner("Audit Failed: " + (data.message || "Error executing task"), 100);
                    document.getElementById('btnRunAudit').disabled = false;
                }
            } catch (err) {
                clearInterval(interval);
                showStatusBanner("Polling error: " + err.message, 100);
                document.getElementById('btnRunAudit').disabled = false;
            }
        }, 1500);
    }

    function showStatusBanner(msg, pct) {
        const banner = document.getElementById('statusBanner');
        if (!banner) return;
        banner.classList.remove('hidden');
        document.getElementById('statusMessage').textContent = msg;
        document.getElementById('statusPercentage').textContent = pct + '%';
        document.getElementById('progressBar').style.width = pct + '%';
    }

    function renderAuditData(data) {
        document.getElementById('metricsContainer').classList.remove('hidden');
        document.getElementById('metricTotalDevices').textContent = data.total_devices || 0;
        document.getElementById('metricTier1').textContent = data.tier_1_mpp_direct_count || 0;
        document.getElementById('metricTier2').textContent = data.tier_2_gateway_count || 0;
        document.getElementById('metricTier3').textContent = data.tier_3_incompatible_count || 0;

        const totalLines = data.total_lines || 0;
        const compliantLines = data.e164_compliant_lines_count || 0;
        const pct = totalLines > 0 ? Math.round((compliantLines / totalLines) * 100) : 0;

        document.getElementById('metricE164').textContent = pct + '%';
        document.getElementById('metricE164Sub').textContent = `${compliantLines} of ${totalLines} Lines`;

        document.getElementById('tableContainer').classList.remove('hidden');
        document.getElementById('paginationControls').classList.remove('hidden');

        stagedEndpoints = (data.devices || []).map((dev, idx) => {
            const primaryLine = (dev.lines && dev.lines.length > 0) ? dev.lines[0] : {};
            const ext = primaryLine.dn || '';
            const e164 = primaryLine.e164_suggested || ext;
            const isUserAssigned = Boolean(dev.owner_email && dev.owner_email.includes('@'));
            const devName = dev.device_name || '';
            const devModel = dev.device_model || 'Cisco 8811';
            const isSoftphone = /^(CSF|TCT|BOT|TAB)/i.test(devName)
                || (/client services framework|dual mode|jabber|webex|softphone/i.test(devModel) && !/\b(desk|room|board)\b/i.test(devModel));

            const matchedLoc = availableLocations.find(l => l.name.toLowerCase() === (dev.device_pool || '').toLowerCase())
                || availableLocations[0]
                || { id: "", name: dev.device_pool || "Select Webex location" };

            return {
                index: idx,
                selected: dev.migration_tier === 'TIER_1_MPP_DIRECT' || isSoftphone,
                is_softphone: isSoftphone,
                endpoint_type: isSoftphone ? 'SOFTPHONE' : 'PHYSICAL',
                device_name: devName,
                clean_mac: isSoftphone ? '' : devName.replace(/^SEP/i, '').toUpperCase(),
                device_model: devModel,
                device_pool: dev.device_pool || '',
                migration_tier: dev.migration_tier || 'TIER_1_MPP_DIRECT',
                entity_type: (isUserAssigned || isSoftphone) ? 'PEOPLE' : 'WORKSPACE',
                owner_userid: dev.owner_userid || '',
                owner_email: dev.owner_email || '',
                display_name: dev.description || dev.owner_userid || `Phone-${ext}`,
                extension: ext,
                e164_suggested: e164,
                lines: dev.lines && dev.lines.length > 0 ? dev.lines : (ext ? [{ dn: ext, e164_suggested: e164 }] : []),
                target_location_id: matchedLoc.id,
                target_location_name: matchedLoc.name,
                calling_license_type: (isUserAssigned || isSoftphone) ? 'PROFESSIONAL' : 'WORKSPACE'
            };
        });

        currentPage = 1;
        renderTableRows();
    }

    function changePage(direction) {
        const totalPages = Math.ceil(stagedEndpoints.length / pageSize);
        currentPage += direction;

        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;

        renderTableRows();
    }

    function renderTableRows() {
        const tbody = document.getElementById('inventoryTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, stagedEndpoints.length);
        const pagedData = stagedEndpoints.slice(startIndex, endIndex);

        document.getElementById('pageStart').textContent = stagedEndpoints.length > 0 ? startIndex + 1 : 0;
        document.getElementById('pageEnd').textContent = endIndex;
        document.getElementById('pageTotal').textContent = stagedEndpoints.length;

        document.getElementById('btnPrevPage').disabled = currentPage === 1;
        document.getElementById('btnNextPage').disabled = endIndex >= stagedEndpoints.length;

        const fragment = document.createDocumentFragment();

        pagedData.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-700/30 transition-colors border-b border-slate-700/40";

            const locOptions = availableLocations.length > 0
                ? availableLocations.map(l => `<option value="${l.id}" ${l.id === item.target_location_id ? 'selected' : ''}>${l.name}</option>`).join('')
                : `<option value="${item.target_location_id}">${item.target_location_name}</option>`;

            let tierBadge = '<span class="bg-slate-700 text-slate-300 text-[10px] px-1.5 py-0.5 rounded">Unknown</span>';
            if (item.migration_tier === 'TIER_1_MPP_DIRECT') {
                tierBadge = '<span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] px-2 py-0.5 rounded font-bold">MPP Direct</span>';
            } else if (item.is_softphone) {
                tierBadge = '<span class="bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-[10px] px-2 py-0.5 rounded font-bold">Softphone (Webex App)</span>';
            } else if (item.migration_tier === 'TIER_2_GATEWAY_SOFTPHONE' || item.migration_tier === 'TIER_2_GATEWAY') {
                tierBadge = '<span class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] px-2 py-0.5 rounded font-bold">Gateway / ATA</span>';
            } else {
                tierBadge = '<span class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-[10px] px-2 py-0.5 rounded font-bold">Incompatible</span>';
            }

            const deviceDisplay = item.is_softphone
                ? '<span class="text-cyan-400">Softphone (No MAC)</span>'
                : item.clean_mac;

            tr.innerHTML = `
              <td class="p-3 text-center">
                <input type="checkbox" class="row-checkbox rounded border-slate-700 bg-slate-800 text-cyan-500 focus:ring-0"
                       onchange="updateStagedItem(${item.index}, 'selected', this.checked)" ${item.selected ? 'checked' : ''}/>
              </td>
              <td class="p-3 font-mono font-bold text-white">
                ${deviceDisplay}
                <div class="text-[10px] text-slate-500 font-sans">${item.device_name}</div>
              </td>
              <td class="p-3">
                <div class="font-medium text-slate-200">${item.device_model}</div>
                <div>${tierBadge}</div>
              </td>
              <td class="p-3">
                <select onchange="updateStagedItem(${item.index}, 'entity_type', this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 focus:outline-none">
                  <option value="PEOPLE" ${item.entity_type === 'PEOPLE' ? 'selected' : ''}>👤 User (Person)</option>
                  <option value="WORKSPACE" ${item.entity_type === 'WORKSPACE' ? 'selected' : ''}>🏢 Workspace</option>
                </select>
              </td>
              <td class="p-3">
                <input type="text" value="${item.display_name}" onchange="updateStagedItem(${item.index}, 'display_name', this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 w-full"/>
                <div class="text-[10px] text-slate-500 truncate">${item.owner_email || 'Unassigned'}</div>
              </td>
              <td class="p-3 font-mono">
                <input type="text" value="${item.extension}" onchange="updateStagedItem(${item.index}, 'extension', this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-xs rounded px-2 py-1 w-20 mb-1"/>
                <div class="text-[10px] text-emerald-400">${item.e164_suggested}</div>
              </td>
              <td class="p-3">
                <select onchange="updateStagedItem(${item.index}, 'target_location_id', this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 w-full focus:outline-none">
                  ${locOptions}
                </select>
              </td>
              <td class="p-3">
                <select onchange="updateStagedItem(${item.index}, 'calling_license_type', this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 focus:outline-none">
                  <option value="PROFESSIONAL" ${item.calling_license_type === 'PROFESSIONAL' ? 'selected' : ''}>Professional</option>
                  <option value="STANDARD" ${item.calling_license_type === 'STANDARD' ? 'selected' : ''}>Standard</option>
                  <option value="WORKSPACE" ${item.calling_license_type === 'WORKSPACE' ? 'selected' : ''}>Workspace Area</option>
                </select>
              </td>
            `;
            fragment.appendChild(tr);
        });

        tbody.appendChild(fragment);

        const allVisibleChecked = Array.from(document.querySelectorAll('.row-checkbox')).every(cb => cb.checked);
        const selectAllCb = document.getElementById('selectAll');
        if (selectAllCb) selectAllCb.checked = pagedData.length > 0 && allVisibleChecked;
    }

    function updateStagedItem(idx, field, value) {
        if (stagedEndpoints[idx]) {
            stagedEndpoints[idx][field] = value;
        }
    }

    function applyBulkLocation() {
        const locId = document.getElementById('bulkLocationSelect').value;
        if (!locId) return;
        const locObj = availableLocations.find(l => l.id === locId);
        const locName = locObj ? locObj.name : locId;

        stagedEndpoints.forEach(item => {
            if (item.selected) {
                item.target_location_id = locId;
                item.target_location_name = locName;
            }
        });
        renderTableRows();
    }

    function toggleSelectAll(mainCb) {
        stagedEndpoints.forEach(item => item.selected = mainCb.checked);
        renderTableRows();
    }

    function exportVerificationCsvPackage() {
        const selected = stagedEndpoints.filter(i => i.selected);
        if (selected.length === 0) return alert("Please select at least one endpoint to export.");

        // 1. Locations CSV
        const uniqueLocs = [...new Set(selected.map(s => s.target_location_name))];
        const locRows = [["Location Name", "Address Line 1", "City", "State", "ZIP", "Country", "Time Zone"]];
        uniqueLocs.forEach(loc => {
            locRows.push([`"${loc}"`, `"100 Innovation Way"`, `"Austin"`, `"TX"`, `"78701"`, `"United States"`, `"America/Chicago"`]);
        });

        // 2. Workspaces CSV
        const wsRows = [["Workspace Name", "Location Name", "Type", "Capacity", "Calling Behavior", "Extension", "Phone Number", "Device Model", "MAC Address"]];
        selected.filter(s => s.entity_type === 'WORKSPACE').forEach(ws => {
            wsRows.push([`"${ws.display_name}"`, `"${ws.target_location_name}"`, `"desk"`, `"1"`, `"Webex Calling"`, `"${ws.extension}"`, `""`, `"${ws.device_model}"`, `"${ws.clean_mac}"`]);
        });

        // 3. MPP & Softphone Users CSV
        const userRows = [["First Name", "Last Name", "Display Name", "Email", "Extension", "Phone Number", "Location", "Device Model", "MAC Address", "Port"]];
        selected.filter(s => s.entity_type === 'PEOPLE').forEach(u => {
            const names = u.display_name.split(' ');
            const first = names[0] || 'User';
            const last = names.slice(1).join(' ') || 'Employee';
            const fallbackLocal = (u.clean_mac || u.device_name || 'user').toLowerCase();
            const email = u.owner_email && u.owner_email !== 'N/A' ? u.owner_email : `${fallbackLocal}@corp.internal`;
            const exportModel = u.is_softphone ? 'Webex App (Softphone)' : u.device_model;
            const exportMac = u.is_softphone ? '' : u.clean_mac;
            const exportPhone = (u.e164_suggested && u.e164_suggested.startsWith('+')) ? u.e164_suggested : '';
            userRows.push([`"${first}"`, `"${last}"`, `"${u.display_name}"`, `"${email}"`, `"${u.extension}"`, `"${exportPhone}"`, `"${u.target_location_name}"`, `"${exportModel}"`, `"${exportMac}"`, `"1"`]);
        });

        downloadCsv("webex_calling_user_import.csv", userRows);
        if (wsRows.length > 1) setTimeout(() => downloadCsv("webex_workspaces_import.csv", wsRows), 500);
        if (locRows.length > 1) setTimeout(() => downloadCsv("webex_locations_import.csv", locRows), 1000);
    }

    function downloadCsv(filename, rows) {
        const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\r\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    async function triggerWebexBatchProvision(stepUpCredentials = null) {
        const selected = stagedEndpoints.filter(i => i.selected);
        if (selected.length === 0) {
            alert("No eligible devices selected for import.");
            return;
        }
        if (!getWebexAccessToken()) {
            alert("Paste your Webex bearer token and refresh tenant data before provisioning.");
            const tokenInput = document.getElementById("webexAccessToken");
            if (tokenInput) {
                tokenInput.focus();
            } else if (typeof promptWebexToken === 'function') {
                promptWebexToken();
            }
            return;
        }
        if (selected.some(item => !item.target_location_id)) {
            alert("Select a valid Webex location for every selected endpoint before provisioning.");
            return;
        }

        const callingLicenseId = document.getElementById("controlLicenseSelect")?.value
            || document.getElementById("bulkLicenseSelect")?.value
            || document.getElementById("wsLicenseSelect")?.value
            || null;

        const hasUserEndpoints = selected.some(d => (d.entity_type || 'PEOPLE') === 'PEOPLE');
        if (!callingLicenseId && hasUserEndpoints) {
            alert("Please select a Webex Calling License from the dropdown before ingesting user endpoints.");
            return;
        }

        if (!stepUpCredentials) {
            if (!confirm(`Are you sure you want to provision ${selected.length} endpoints directly into Webex Control Hub?\n\nProceed to authenticate with corporate directory credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => triggerWebexBatchProvision({ username, password }));
            return;
        }

        showStatusBanner(`Queuing batch provisioning for ${selected.length} Webex Calling profiles...`, 10);

        try {
            const res = await fetchWithWebexAuth('/api/v1/telecom/webex-provision', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cucm_audit_data: { devices: selected },
                    calling_license_id: callingLicenseId
                })
            });
            const data = await res.json();

            if (res.ok && data.task_id) {
                pollProvisionTask(data.task_id);
            } else {
                showStatusBanner("Webex import trigger failed: " + (data.detail || "Unknown error"), 100);
            }
        } catch (err) {
            showStatusBanner("Network error starting Webex import: " + err.message, 100);
        }
    }

    function pollProvisionTask(taskId) {
        const interval = setInterval(async () => {
            try {
                const res = await fetchWithAuth(`/api/v1/telecom/tasks/${taskId}`);
                const data = await res.json();

                if (data.status === 'RUNNING' || data.status === 'PROGRESS') {
                    showStatusBanner(data.message || "Provisioning Webex Control Hub profiles...", data.progress || 50);
                } else if (data.status === 'COMPLETED') {
                    clearInterval(interval);
                    showStatusBanner(data.message || "Webex Calling Provisioning Complete!", 100);
                    const resultsBox = document.getElementById('auditProvisionResults');
                    const resultsBody = document.getElementById('auditProvisionResultsBody');
                    const items = data.data && Array.isArray(data.data.items) ? data.data.items : [];
                    if (resultsBox && resultsBody && items.length > 0) {
                        resultsBox.classList.remove('hidden');
                        resultsBody.innerHTML = items.map(it => {
                            const color = it.status === 'SUCCESS' ? 'text-emerald-400' : (it.status === 'SKIPPED' ? 'text-amber-300' : 'text-rose-400');
                            return `<div class="${color}">[${escapeHtml(it.status)}] ${escapeHtml(it.device_name)} (${escapeHtml(it.owner_email || 'N/A')} | Ext ${escapeHtml(it.extension || '-')}) — ${escapeHtml(it.details)}</div>`;
                        }).join('');
                    }
                } else if (data.status === 'FAILED') {
                    clearInterval(interval);
                    showStatusBanner("Provisioning Failed: " + (data.message || "Error executing batch task"), 100);
                }
            } catch (err) {
                clearInterval(interval);
                showStatusBanner("Polling error: " + err.message, 100);
            }
        }, 2000);
    }

            const key = row.querySelector(".dtmf-key-input").value.trim();
            const action = row.querySelector(".dtmf-action-select").value;
            const targetInput = row.querySelector(".dtmf-target-input");
            const destination = targetInput ? targetInput.value.trim() : "";

            if (key) {
                mappings[key] = {
                    type: action,
                    destination: destination,
                    priority: "1"
                };
            }
        });

        const payload = {
            cluster: document.getElementById("uccx-cluster-select").value,
            flow_name: document.getElementById("flow-name-input").value.trim(),

        try {
            const resp = await fetchWithAuth("/api/v1/telecom/uccx/generate-flow", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || "Failed to generate Flow schema.");
            }

            const result = await resp.json();
            generatedFlowPayload = result.flow_schema;

            document.getElementById("output-flow-title").textContent = result.flow_name;
            document.getElementById("output-flow-meta").textContent = `Nodes: ${result.total_nodes} | Edges: ${result.total_edges} | Cluster Source: ${result.cluster}`;

    async function loadWebexLicenses() {
        const selectIds = ["wsLicenseSelect", "controlLicenseSelect", "bulkLicenseSelect", "devLicenseSelect"];
        const selects = selectIds.map(id => document.getElementById(id)).filter(Boolean);
        if (selects.length === 0) return;

        if (!getWebexAccessToken()) {
            selects.forEach(sel => {
                sel.innerHTML = "<option value=''>Paste token and refresh</option>";
            });
            return;
        }

        selects.forEach(sel => {
            sel.innerHTML = "<option value=''>Discovering Webex Licenses...</option>";
        });

        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/webex/licenses");
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.detail || `Could not query licenses (HTTP ${resp.status}).`);
            }
            const data = await resp.json();
            if (data.status === "ERROR") {
                if (data.error && (data.error.includes("missing or expired") || data.error.includes("WEBEX_ACCESS_TOKEN"))) {
                    promptWebexToken();
                }
                throw new Error(data.error || "Webex license discovery failed.");
            }
            availableWebexLicenses = data.licenses || [];
            availableWsLicenses = availableWebexLicenses;

            selects.forEach(select => {
                const isWorkspaceSelect = select.id === "wsLicenseSelect";
                const prevVal = select.value;
                select.innerHTML = "";

                if (availableWebexLicenses.length === 0) {
                    select.innerHTML = "<option value=''>No licenses detected in Webex tenant</option>";
                    return;
                }

                let defaultSelected = false;

                availableWebexLicenses.forEach(lic => {
                    const opt = document.createElement("option");
                    opt.value = lic.id;
                    opt.textContent = `${lic.name} (${lic.consumedUnits}/${lic.totalUnits})`;

                    if (prevVal && lic.id === prevVal) {
                        opt.selected = true;
                        defaultSelected = true;
                    } else if (!defaultSelected) {
                        if (isWorkspaceSelect && lic.is_workspace_eligible) {
                            opt.selected = true;
                            defaultSelected = true;
                        } else if (!isWorkspaceSelect && (lic.is_user_eligible || (lic.name && (lic.name.toLowerCase().includes("professional") || lic.name.toLowerCase().includes("calling"))))) {
                            opt.selected = true;
                            defaultSelected = true;
                        }
                    }
                    select.appendChild(opt);
                });

                if (!defaultSelected && select.options.length > 0) {
                    select.options[0].selected = true;
                }
            });

            const activeVal = document.getElementById("controlLicenseSelect")?.value
                || document.getElementById("bulkLicenseSelect")?.value
                || document.getElementById("wsLicenseSelect")?.value;
            if (activeVal) {
                syncLicenseSelects(activeVal);
            }
        } catch (e) {
            console.error("Webex license discovery failed:", e);
            selects.forEach(sel => {
                sel.innerHTML = `<option value="">⚠️ License Fetch Failed: ${e.message}</option>`;
            });
            throw e;
        }
    }

    async function executeWsBatchImport(
        dryRun = true,
        stepUpCredentials = null,
        approvedRows = null,
        approvedLicenseId = null
    ) {
        const selected = approvedRows || stagedWorkspaces.filter(r => r.selected);
        if (selected.length === 0) {
            alert("No rows selected. Please select at least one row.");
            return;
        }

        const actionName = dryRun
            ? "Pre-Flight Dry Run Simulation"
            : "LIVE Webex Device Provisioning";
        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`CAUTION: You are about to LIVE PROVISION ${selected.length} selected records directly into Webex Control Hub. Existing-owner rows will be assigned to their listed users/workspaces; other rows will create new Calling workspaces. Are you sure you want to proceed?`)) {
                return;
            }
            const rowsForAuthorization = selected.map(row => ({ ...row }));
            const licenseForAuthorization = document.getElementById("wsLicenseSelect").value || null;
            requestTelecomStepUp((username, password) => executeWsBatchImport(
                false,
                { username, password },
                rowsForAuthorization,
                licenseForAuthorization
            ));
            return;
        }

        const execContainer = document.getElementById("wsExecutionContainer");
        const execBadge = document.getElementById("wsExecBadge");
        const execTitle = document.getElementById("wsExecTitle");
        const progressBar = document.getElementById("wsExecProgressBar");
        const progressPct = document.getElementById("wsExecProgressPct");
        const logBox = document.getElementById("wsExecLog");

        execContainer.classList.remove("hidden");
        execBadge.textContent = dryRun ? "Dry Run" : "Live Provisioning";
        execBadge.className = dryRun ? "bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold px-2 py-0.5 rounded uppercase" : "bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-2 py-0.5 rounded uppercase";
        execTitle.textContent = `${actionName} (${selected.length} items)`;
        progressBar.style.width = "10%";
        progressPct.textContent = "10%";
        logBox.innerHTML = `<div class="text-cyan-400">[00:00:00] Initializing ${actionName} for ${selected.length} records...</div>`;

        execContainer.scrollIntoView({ behavior: 'smooth' });

        const licenseId = (approvedLicenseId ?? document.getElementById("wsLicenseSelect").value) || null;

        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/workspaces/import", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    rows: selected,
                    dry_run: dryRun,
                    calling_license_id: licenseId,
                    ...(stepUpCredentials ? {
                        step_up_user: stepUpCredentials.username,
                        step_up_pass: stepUpCredentials.password
                    } : {})
                })
            });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || "Batch import request failed.");
            }

            const data = await resp.json();
            const exec = data.execution;

            progressBar.style.width = "100%";
            progressPct.textContent = "100%";

            logBox.innerHTML += `<div class="text-slate-300 font-bold mt-2">=== ${actionName} Summary: Total: ${exec.total_processed} | Succeeded: ${exec.successful_count} | Failed: ${exec.failed_count} | Skipped: ${exec.skipped_count} ===</div>`;

            (exec.items || []).forEach(item => {
                let statusColor = "text-emerald-400";
                if (item.status === "FAILED") statusColor = "text-rose-400";
                else if (item.status === "DRY_RUN") statusColor = "text-cyan-400";
                else if (item.status === "SKIPPED") statusColor = "text-slate-500";

                const detail = item.error_message ? ` - ${item.error_message}` : "";
                const ids = item.workspace_id ? ` [WorkspaceID: ${item.workspace_id.slice(0, 15)}...]` : "";
                logBox.innerHTML += `<div class="${statusColor}">[Row ${item.row_number}] ${item.display_name} (${item.mac}) -> ${item.status}${ids}${detail}</div>`;
            });

            if (!dryRun && exec.successful_count > 0) {
                logBox.innerHTML += `<div class="text-amber-300 font-bold mt-2 pt-1 border-t border-slate-800">👉 NEXT STEP (Phase 4): ${exec.successful_count} device(s) live provisioned in Webex! Proceed to Step 4 below to export the CUCM Decommission batch and inject coexistence Route Patterns.</div>`;
            }

            logBox.scrollTop = logBox.scrollHeight;
        } catch (e) {
            progressBar.style.width = "100%";
            progressPct.textContent = "Error";
            logBox.innerHTML += `<div class="text-rose-400 font-bold mt-2">[ERROR] Batch failed: ${e.message}</div>`;
        }
    }

    function exportWsCleanedCsv() {
        const selected = stagedWorkspaces.filter(r => r.selected);
        if (selected.length === 0) return alert("Select at least one row to export.");

        const assignedDeviceFormat = selected.some(r => r.owner_type);
        const headers = assignedDeviceFormat
            ? ["macAddress", "model", "ownerType", "ownerEmail", "personId", "workspaceId", "locationName", "locationId", "displayName", "notes"]
            : ["displayName", "locationName", "type", "capacity", "callingType", "extension", "mac", "model"];
        const csvCell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
        const rows = [headers];
        selected.forEach(r => {
            const values = assignedDeviceFormat
                ? [
                    r.clean_mac,
                    r.model,
                    r.owner_type,
                    r.owner_email,
                    r.person_id,
                    r.workspace_id,
                    r.location_name,
                    r.location_id,
                    r.display_name,
                    ""
                ]
                : [
                    r.display_name,
                    r.location_name,
                    r.type,
                    r.capacity,
                    r.calling_type,
                    r.extension,
                    r.clean_mac,
                    r.model
                ];
            rows.push(values.map(csvCell));
        });

        const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\r\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `webex_workspaces_ready_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function handleLocationCorrectionFile(evt) {
        const file = evt.target.files && evt.target.files[0];
        if (!file) return;
        resetLocationCorrectionPreview();
        document.getElementById("wsCorrectionFileName").textContent =
            `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

        const reader = new FileReader();
        reader.onload = event => {

            resetLocationCorrectionPreview();
        };
        reader.onerror = () => {
            document.getElementById("wsCorrectionSummary").textContent = "Could not read the selected CSV file.";

        reader.readAsText(file);

    async function runWorkspaceLocationAction(actionType, dryRun, stepUpCredentials = null) {
        const csvContent = document.getElementById("wsCorrectionCsv").value.trim();
        const token = getWebexAccessToken();
        const migration = actionType === "migration";
        if (!csvContent) {
            alert("Select or paste the workspace CSV first.");
            return;
        }
        if (!token) {
            alert("Paste your Webex bearer token before previewing or applying this action.");
            document.getElementById("webexAccessToken").focus();
            return;
        }
        const previewReady = migration ? locationMigrationPreviewReady : deviceRecoveryPreviewReady;
        if (!dryRun && !previewReady) {
            alert("Run a fresh preview for this action before applying it.");
            return;
        }
        const confirmation = migration
            ? "This will move eligible workspaces and phones to the CSV locations. For Calling-enabled workspaces it creates and verifies a replacement and its MPP assignments before deleting the original. It then transfers the Calling number (if present) and original workspace name. Continue?"
            : "This will re-associate each eligible, currently unassigned phone to its original workspace. It will not change workspace locations or Calling settings. Continue?";
        if (!dryRun && !stepUpCredentials) {
            if (!confirm(confirmation)) {
                return;
            }
            requestTelecomStepUp((username, password) => runWorkspaceLocationAction(
                actionType,
                false,
                { username, password }
            ));
            return;
        }
        if (!dryRun) {
            locationMigrationPreviewReady = false;
            deviceRecoveryPreviewReady = false;
        }

        const previewButton = document.getElementById(migration ? "btnPreviewLocationMigration" : "btnPreviewDeviceRecovery");
        const applyButton = document.getElementById(migration ? "btnApplyLocationMigration" : "btnApplyDeviceRecovery");
        const otherPreviewButton = document.getElementById(migration ? "btnPreviewDeviceRecovery" : "btnPreviewLocationMigration");
        const otherApplyButton = document.getElementById(migration ? "btnApplyDeviceRecovery" : "btnApplyLocationMigration");
        const summary = document.getElementById("wsCorrectionSummary");
        previewButton.disabled = true;
        otherPreviewButton.disabled = true;
        applyButton.disabled = true;
        otherApplyButton.disabled = true;
        if (dryRun) {
            if (migration) locationMigrationPreviewReady = false;
            else deviceRecoveryPreviewReady = false;
        }
        summary.textContent = dryRun
            ? (migration ? "Checking workspaces, target locations, and device assignments..." : "Checking original workspaces and device assignments...")
            : (migration ? "Migrating workspaces and assigned phones..." : "Restoring detached phone assignments...");

        try {
            const endpoint = migration
                ? "/api/v1/telecom/workspaces/correct-locations"
                : "/api/v1/telecom/workspaces/recover-device-assignments";
            const response = await fetchWithWebexAuth(endpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Webex-Access-Token": token
                },
                body: JSON.stringify({
                    csv_content: csvContent,
                    dry_run: dryRun,
                    ...(stepUpCredentials ? {
                        step_up_user: stepUpCredentials.username,
                        step_up_pass: stepUpCredentials.password
                    } : {})
                })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || (migration ? "Workspace location migration failed." : "Device assignment recovery failed."));
            }

            const execution = data.execution;
            const eligible = (execution.items || []).some(item => item.status === "DRY_RUN");
            const resultsBody = document.getElementById("wsCorrectionResultsBody");
            resultsBody.replaceChildren();
            (execution.items || []).forEach(item => {
                const row = document.createElement("tr");
                const values = [
                    item.row_number,
                    `${item.display_name || "(unnamed)"} / ${item.mac || "(no MAC)"}`,
                    item.workspace_id || "-",
                    item.current_location || "-",
                    `${item.status}: ${item.error_message || ""}`
                ];
                values.forEach(value => {
                    const cell = document.createElement("td");
                    cell.className = "p-2.5 align-top";
                    cell.textContent = String(value);
                    row.appendChild(cell);
                });
                resultsBody.appendChild(row);
            });
            document.getElementById("wsCorrectionResults").classList.remove("hidden");

            const action = dryRun
                ? (migration ? "ready to migrate" : "ready to restore")
                : (migration ? "migrated" : "restored");
            summary.textContent =
                `${execution.successful_count} ${action}; ${execution.unchanged_count} already correct; ${execution.failed_count} failed.`;
            if (dryRun) {
                if (migration) locationMigrationPreviewReady = eligible;
                else deviceRecoveryPreviewReady = eligible;
                applyButton.disabled = !eligible;
            }
        } catch (error) {
            summary.textContent = error.message;
        } finally {
            previewButton.disabled = false;
            otherPreviewButton.disabled = false;
            document.getElementById("btnApplyLocationMigration").disabled = !locationMigrationPreviewReady;
            document.getElementById("btnApplyDeviceRecovery").disabled = !deviceRecoveryPreviewReady;
        }
    }

                data = await response.json();
            } catch (_) {
                data = null;
            }

            if (!response.ok) {

            document.getElementById("locMetricReady").textContent = data.new_to_create_count;
            document.getElementById("locMetricInvalid").textContent = data.invalid_address_count;
            const redskyReadyCount = stagedMerakiLocations.filter(l => l.redsky_status === "VALID" || l.redsky_status === "READY").length;
            const rsMetricEl = document.getElementById("locMetricRedsky");
            if (rsMetricEl) rsMetricEl.textContent = redskyReadyCount;

            document.getElementById("locMetricsContainer").classList.remove("hidden");
            document.getElementById("locControlsContainer").classList.remove("hidden");
            document.getElementById("locTableContainer").classList.remove("hidden");
            loadPstnRoutingOptions();

            tableBody.innerHTML = "";
            stagedMerakiLocations.forEach(loc => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/60 transition";
                tr.dataset.name = (loc.location_name || "").toLowerCase();
                tr.dataset.address = (loc.address_line_1 || "").toLowerCase();
                tr.dataset.city = `${loc.city || ""} ${loc.state || ""} ${loc.zip_code || ""}`.toLowerCase();
                tr.dataset.tz = (loc.time_zone || "").toLowerCase();
                tr.dataset.models = (loc.appliance_models || []).join(" ").toLowerCase();
                tr.dataset.status = loc.exists_in_webex ? "exists" : (!loc.is_valid ? "incomplete" : "ready");
                tr.dataset.redsky = (loc.redsky_status || "unconfigured").toLowerCase();
                tr.dataset.subnet = ((loc.phone_subnets || []).join(" ") + " " + (loc.wiremap_strategy || "")).toLowerCase();

                } else if (!loc.is_valid) {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30" title="Missing: ${loc.missing_fields.join(', ')}">Address Incomplete</span>`;

                    statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Ready to Create</span>`;
                }

                let redskyBadge = "";
                const rsStatus = loc.redsky_status || "UNCONFIGURED";
                if (rsStatus === "VALID") {
                    redskyBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" title="Building ID: ${loc.redsky_building_id || 'Matched'}">MSAG Valid</span>`;

    function applyLocationFilters() {
        const rows = document.querySelectorAll("#locTableBody tr");
        const filters = {};
        document.querySelectorAll("[data-loc-filter]").forEach(el => {
            filters[el.dataset.locFilter] = (el.value || "").trim().toLowerCase();
        });

        let visible = 0;
        rows.forEach(tr => {
            const match =
                (!filters.name || (tr.dataset.name || "").includes(filters.name)) &&
                (!filters.address || (tr.dataset.address || "").includes(filters.address)) &&
                (!filters.city || (tr.dataset.city || "").includes(filters.city)) &&
                (!filters.tz || (tr.dataset.tz || "").includes(filters.tz)) &&
                (!filters.models || (tr.dataset.models || "").includes(filters.models)) &&
                (!filters.status || tr.dataset.status === filters.status) &&
                (!filters.redsky || tr.dataset.redsky === filters.redsky) &&
                (!filters.subnet || (tr.dataset.subnet || "").includes(filters.subnet));
            tr.classList.toggle("hidden", !match);
            if (match) visible++;
        });

        const counter = document.getElementById("locVisibleCount");
        if (counter) counter.textContent = rows.length ? `${visible}/${rows.length}` : "";
    }

    async function loadPstnRoutingOptions() {
        const select = document.getElementById("locRoutingChoice");
        if (!select) return;
        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/pstn/routing-options");
            if (!resp.ok) return;
            const options = await resp.json();
            if (options && options.length > 0) {
                const currentVal = select.value || "CUCM";
                select.innerHTML = "";
                options.forEach(opt => {
                    const el = document.createElement("option");
                    el.value = opt.name || opt.id;
                    el.textContent = opt.display || opt.name;
                    if (opt.name === "CUCM" || opt.name.toLowerCase() === currentVal.toLowerCase()) {
                        el.selected = true;
                    }
                    select.appendChild(el);
                });
                if (!options.some(o => o.name === "CUCM")) {
                    const cucmOpt = document.createElement("option");
                    cucmOpt.value = "CUCM";
                    cucmOpt.textContent = "CUCM (Route Group)";
                    cucmOpt.selected = true;
                    select.insertBefore(cucmOpt, select.firstChild);
                }
            }
        } catch (e) {
            console.warn("Could not load dynamic PSTN routing options:", e);
        }
    }


    async function syncMerakiLocations(dryRun, stepUpCredentials = null) {
        const statusBanner = document.getElementById("locStatusBanner");
        const statusLog = document.getElementById("locStatusLog");
        const statusTitle = document.getElementById("locStatusTitle");

        const selectedCheckboxes = Array.from(document.querySelectorAll(".loc-row-checkbox:checked"));
        if (!selectedCheckboxes.length) {
            alert("Select at least one location to sync.");
            return;
        }

        const networkIds = selectedCheckboxes.map(cb => cb.dataset.netId);
        const connectionType = document.getElementById("locConnectionType").value;
        const routingChoice = document.getElementById("locRoutingChoice")?.value.trim() || "CUCM";
        const extLength = parseInt(document.getElementById("locExtLength").value, 10) || 4;
        const routingPrefix = document.getElementById("locRoutingPrefix")?.value.trim() || null;

        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`Are you sure you want to LIVE PROVISION ${networkIds.length} location(s) into Webex Control Hub?\n\nThis will configure organization locations, Webex Calling, and Premises-based PSTN (${routingChoice}).\n\nProceed to authenticate with corporate directory credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => syncMerakiLocations(false, { username, password }));
            return;
        }

        statusBanner.classList.remove("hidden");
        statusTitle.textContent = dryRun ? "Dry-Run Sync In Progress..." : "Live Provisioning In Progress...";
        statusLog.textContent = `Submitting request for ${networkIds.length} location(s)...`;
        statusLog.className = "text-slate-300 whitespace-pre-wrap overflow-x-auto";

        const syncRedsky = document.getElementById("locSyncRedsky") ? document.getElementById("locSyncRedsky").checked : true;

        try {
            const payload = {
                network_ids: networkIds,
                dry_run: dryRun,
                connection_type: connectionType,
                routing_group_id: routingChoice,
                internal_extension_length: extLength,
                routing_prefix: routingPrefix,
                sync_redsky: syncRedsky,
                step_up_user: stepUpCredentials ? stepUpCredentials.username : null,
                step_up_pass: stepUpCredentials ? stepUpCredentials.password : null,
            };

            const response = await fetchWithWebexAuth("/api/v1/telecom/locations/sync-meraki", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || "Location sync request failed.");
            }

            statusTitle.textContent = dryRun ? "Dry-Run Simulation Complete" : "Live Provisioning Completed";
            statusLog.textContent = JSON.stringify(data, null, 2);
            statusLog.className = "text-emerald-400 whitespace-pre-wrap overflow-x-auto";

            // If phone subnets were evaluated, update the corresponding table rows & cache
            window.knownPhoneSubnets = window.knownPhoneSubnets || {};
            if (data && data.results && data.results.length) {
                data.results.forEach(res => {
                    if (res.wiremapped_subnets && res.wiremapped_subnets.length) {
                        window.knownPhoneSubnets[res.network_id] = {
                            subnets: res.wiremapped_subnets,
                            strategy: res.wiremap_strategy
                        };
                    }
                    const cb = document.querySelector(`#locTableBody tr .loc-row-checkbox[data-net-id="${res.network_id}"]`);
                    const tr = cb ? cb.closest("tr") : null;
                    if (tr && res.wiremapped_subnets && res.wiremapped_subnets.length) {
                        const cell = tr.children[8];
                        if (cell) {
                            const isVoice = res.wiremap_strategy === "DEDICATED_VOICE";
                            const badgeStyle = isVoice
                                ? "bg-indigo-500/20 text-indigo-300 border-indigo-500/30"
                                : "bg-cyan-500/20 text-cyan-300 border-cyan-500/30";
                            cell.innerHTML = res.wiremapped_subnets.map(s => 
                                `<div class="mb-0.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-mono border ${badgeStyle}">${s} (${res.wiremap_strategy || 'Voice'})</span></div>`
                            ).join("");
                        }
                    }
                });
            }

            // If live provisioning completed, refresh the preview
            if (!dryRun && data.created_count > 0) {
                previewMerakiLocations();
            }

        } catch (err) {
            statusTitle.textContent = "Sync Execution Failed";
            statusLog.textContent = `Error: ${err.message}`;
            statusLog.className = "text-rose-400 whitespace-pre-wrap overflow-x-auto";
        }
    }

    async function inspectRowPhoneSubnet(e, networkId) {

                    subnets: data.subnets,

    async function provisionLocationDids(dryRun, stepUpCredentials = null) {
        const locationId = document.getElementById("didTargetLocation").value;
        const mainNumber = document.getElementById("didMainNumber").value.trim() || null;
        const rawNumbers = document.getElementById("didNumbersTextarea").value.trim();

        const statusBanner = document.getElementById("locStatusBanner");
        const statusLog = document.getElementById("locStatusLog");
        const statusTitle = document.getElementById("locStatusTitle");

        if (!locationId) {
            alert("Please select a target Webex location.");
            return;
        }

        const phoneNumbers = rawNumbers
            .split("\n")
            .map(n => n.trim())
            .filter(n => n.length > 0);

        if (!phoneNumbers.length) {
            alert("Enter at least one phone number in E.164 format (e.g. +15125550199).");
            return;
        }

        if (!dryRun && !stepUpCredentials) {
            if (!confirm(`Are you sure you want to LIVE ACTIVATE ${phoneNumbers.length} number(s) on the selected location? Proceed to authenticate with corporate directory credentials?`)) {
                return;
            }
            requestTelecomStepUp((username, password) => provisionLocationDids(false, { username, password }));
            return;
        }

        statusBanner.classList.remove("hidden");
        statusTitle.textContent = dryRun ? "Validating DIDs..." : "Activating DIDs...";
        statusLog.textContent = `Processing ${phoneNumbers.length} phone number(s)...`;

        try {
            const payload = {
                phone_numbers: phoneNumbers,
                main_number: mainNumber,
                dry_run: dryRun,
                step_up_user: stepUpCredentials ? stepUpCredentials.username : null,
                step_up_pass: stepUpCredentials ? stepUpCredentials.password : null,
            };

            const response = await fetchWithWebexAuth(`/api/v1/telecom/locations/${encodeURIComponent(locationId)}/dids`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || "DID provisioning request failed.");
            }

            statusTitle.textContent = dryRun ? "DID Dry-Run Validation Passed" : "DIDs Activated Successfully";
            statusLog.textContent = JSON.stringify(data, null, 2);
            statusLog.className = "text-emerald-400 whitespace-pre-wrap overflow-x-auto";

        } catch (err) {
            statusTitle.textContent = "DID Provisioning Failed";
            statusLog.textContent = `Error: ${err.message}`;
            statusLog.className = "text-rose-400 whitespace-pre-wrap overflow-x-auto";
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function forceRefreshWebexLocations(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        if (isLoadingWebexLocations) return;

        let token = getWebexAccessToken();
        if (!token && typeof promptWebexToken === 'function') {
            token = promptWebexToken();
        }
        if (!token) {
            alert("Please paste your Webex Bearer Token to load locations.");
            return;
        }

        isLoadingWebexLocations = true;
        const badge = document.getElementById("devLocationCountBadge");
        if (badge) {
            badge.textContent = "Loading locations...";
            badge.className = "text-[10px] text-cyan-400 font-mono animate-pulse";
        }

        const input = document.getElementById("devLocationSearchInput");
        filterLocationDropdown(input ? input.value : "", false);

        try {
            await loadWebexLocations();
            if (typeof fetchMerakiLocationsSilently === 'function') {
                await fetchMerakiLocationsSilently();
            }
        } catch (err) {

            if (badge) {
                badge.textContent = "Failed to load locations";
                badge.className = "text-[10px] text-rose-400 font-mono";

    async function fetchMerakiLocationsSilently() {
        if (isFetchingMerakiSilently || (stagedMerakiLocations && stagedMerakiLocations.length > 0)) {
            return;
        }
        isFetchingMerakiSilently = true;
        try {
            const resp = await fetchWithWebexAuth("/api/v1/telecom/locations/meraki-preview");
            if (resp.ok) {
                const data = await resp.json();
                if (data && data.locations && data.locations.length) {
                    stagedMerakiLocations = data.locations;
                    updateCombinedLocations();
                }
            }
        } catch (e) {
            console.warn("Silent Meraki location fetch skipped/failed:", e);
        } finally {
            isFetchingMerakiSilently = false;
        }
    }

    function updateCombinedLocations() {
        const map = new Map();

        // 1. Add active Webex locations
        (availableLocations || []).forEach(loc => {
            const id = loc.id;
            const name = loc.name || "Unnamed Location";
            const city = loc.city || "";
            const state = loc.state || "";
            const zip = loc.postalCode || loc.zip || "";
            const tz = loc.timeZone || "";
            const key = name.trim().toLowerCase();
            map.set(key, {
                id: id,
                webex_location_id: id,
                name: name,
                city: city,
                state: state,
                zip: zip,
                timeZone: tz,
                exists_in_webex: true,
                source: "WEBEX",
                displayText: `${name}${city || state ? ` (${[city, state].filter(Boolean).join(", ")})` : ""}`,
                searchText: `${name} ${city} ${state} ${zip} ${tz}`.toLowerCase()
            });
        });

        // 2. Add or enrich from staged Meraki locations
        (stagedMerakiLocations || []).forEach(loc => {
            const name = loc.location_name || loc.network_name || "Branch Site";
            const key = name.trim().toLowerCase();
            const city = loc.city || "";
            const state = loc.state || "";
            const zip = loc.zip_code || "";
            const tz = loc.time_zone || "";

            if (map.has(key)) {
                const existing = map.get(key);
                if (!existing.city && city) existing.city = city;
                if (!existing.state && state) existing.state = state;
                if (!existing.zip && zip) existing.zip = zip;
                existing.displayText = `${existing.name}${existing.city || existing.state ? ` (${[existing.city, existing.state].filter(Boolean).join(", ")})` : ""}`;
                existing.searchText = `${existing.name} ${existing.city} ${existing.state} ${existing.zip} ${existing.timeZone}`.toLowerCase();
            } else {
                const id = loc.webex_location_id || (loc.network_id ? `MERAKI:${loc.network_id}` : "");
                map.set(key, {
                    id: id,
                    webex_location_id: loc.webex_location_id || null,
                    name: name,
                    city: city,
                    state: state,
                    zip: zip,
                    timeZone: tz,
                    exists_in_webex: Boolean(loc.exists_in_webex && loc.webex_location_id),
                    source: "MERAKI",
                    displayText: `${name}${city || state ? ` (${[city, state].filter(Boolean).join(", ")})` : ""}`,
                    searchText: `${name} ${city} ${state} ${zip} ${tz}`.toLowerCase()
                });
            }
        });

        // Convert map to sorted list: Webex locations first, then alphabetical
        allCombinedLocations = Array.from(map.values()).sort((a, b) => {
            if (a.exists_in_webex !== b.exists_in_webex) {
                return a.exists_in_webex ? -1 : 1;
            }
            return a.name.localeCompare(b.name);
        });

        const badge = document.getElementById("devLocationCountBadge");
        if (badge) {
            badge.textContent = allCombinedLocations.length > 0 
                ? `${allCombinedLocations.length.toLocaleString()} locations` 
                : "No locations loaded";
        }

        const input = document.getElementById("devLocationSearchInput");
        const currentQuery = input ? input.value.trim() : "";
        filterLocationDropdown(currentQuery, false);
    }

    function openLocationDropdown() {
        const menu = document.getElementById("devLocationDropdownMenu");
        if (!menu) return;
        menu.classList.remove("hidden");
        if ((availableLocations || []).length === 0 && !isLoadingWebexLocations && typeof getWebexAccessToken === "function" && getWebexAccessToken()) {
            forceRefreshWebexLocations().catch(e => console.warn("Auto-loading locations on open failed:", e));
        }
        const input = document.getElementById("devLocationSearchInput");
        filterLocationDropdown(input ? input.value : "", false);
    }

    function closeLocationDropdown() {
        const menu = document.getElementById("devLocationDropdownMenu");
        if (menu) menu.classList.add("hidden");
        highlightedLocationIndex = -1;
    }

    function filterLocationDropdown(query = "", shouldOpen = true) {
        const menu = document.getElementById("devLocationDropdownMenu");
        if (!menu) return;
        if (shouldOpen) menu.classList.remove("hidden");

        const q = (query || "").trim().toLowerCase();
        let matches = [];

        if (!q) {
            matches = allCombinedLocations;
        } else {
            const tokens = q.split(/\s+/).filter(Boolean);
            matches = allCombinedLocations.filter(loc => {
                return tokens.every(tok => loc.searchText.includes(tok));
            });
        }

        renderLocationDropdownList(matches);
    }

    function renderLocationDropdownList(list) {
        const menu = document.getElementById("devLocationDropdownMenu");
        if (!menu) return;

        menu.innerHTML = "";
        highlightedLocationIndex = -1;

        // Auto-resolve Option at top
        const autoOpt = document.createElement("div");

                <span class="block text-[10px] text-slate-400">Uses target user's existing Webex calling location</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono border border-slate-700">DEFAULT</span>
        `;
        autoOpt.onmousedown = (e) => {
            e.preventDefault();
            clearLocationSelection();

        menu.appendChild(autoOpt);

        if (isLoadingWebexLocations) {
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "px-3 py-4 text-center text-xs text-cyan-400 font-mono animate-pulse flex items-center justify-center gap-2";
            loadingDiv.innerHTML = `<span>⟳ Fetching Webex Calling locations...</span>`;
            menu.appendChild(loadingDiv);
            return;
        }

        if (!list || list.length === 0) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "px-3 py-3 text-slate-400 text-center text-xs";
            if (!allCombinedLocations || allCombinedLocations.length === 0) {
                emptyDiv.innerHTML = `
                    <div class="italic mb-2 text-slate-400">No locations loaded in session.</div>
                    <button type="button" onmousedown="forceRefreshWebexLocations(event)" class="px-2.5 py-1 text-[11px] bg-indigo-600 hover:bg-indigo-500 text-white rounded font-sans transition">

    function handleLocationKeydown(e) {
        const menu = document.getElementById("devLocationDropdownMenu");
        if (!menu || menu.classList.contains("hidden")) {
            if (e.key === "ArrowDown") {
                openLocationDropdown();
                e.preventDefault();
            }
            return;
        }

        const items = menu.querySelectorAll(".location-option-item");
        if (!items.length) return;

        if (e.key === "ArrowDown") {
            e.preventDefault();
            highlightedLocationIndex = (highlightedLocationIndex + 1) % items.length;
            updateHighlight(items);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            highlightedLocationIndex = (highlightedLocationIndex - 1 + items.length) % items.length;
            updateHighlight(items);
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (highlightedLocationIndex >= 0 && items[highlightedLocationIndex]) {
                items[highlightedLocationIndex].dispatchEvent(new MouseEvent("mousedown"));
            }
        } else if (e.key === "Escape") {
            closeLocationDropdown();
        }
    }

    function updateHighlight(items) {
        items.forEach((item, idx) => {
            if (idx === highlightedLocationIndex) {
                item.classList.add("bg-indigo-600/30", "border-l-2", "border-indigo-400");
                item.scrollIntoView({ block: "nearest" });
            } else {
                item.classList.remove("bg-indigo-600/30", "border-l-2", "border-indigo-400");
            }
        });
    }
